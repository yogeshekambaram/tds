services:
  api:
    build: ./app
    environment:
      REDIS_HOST: redis
    ports:
      - "8000:8000"   # host 8000 is already used by another app on this PC
    depends_on:
      - redis
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
